services:
  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      HL_ASSET_BLACKLIST: ${HL_ASSET_BLACKLIST:-}
      OFI_Z_THRESHOLD: ${OFI_Z_THRESHOLD:-1.5}
      MIN_TRADE_CONFIDENCE: ${MIN_TRADE_CONFIDENCE:-0.75}
      CONTRARIAN_CONFIDENCE: ${CONTRARIAN_CONFIDENCE:-0.85}
      RANGING_CONFIDENCE_BOOST: ${RANGING_CONFIDENCE_BOOST:-0.05}
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
